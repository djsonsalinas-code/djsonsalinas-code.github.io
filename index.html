<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dx Pinas · A&amp;B Records</title>
<meta name="description" content="Dx Pinas — A&amp;B Records. Sígueme en mis redes.">
<meta property="og:title" content="Dx Pinas">
<meta property="og:description" content="A&amp;B Records · Sígueme en mis redes.">
<meta name="theme-color" content="#05070d">
<style>
  :root{
    --ink:#f5f5f7;--muted:#9a9aa6;--gold:#e0b04a;--teal:#2fd1b4;--blue:#2a6db0;
    --glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);
    --p:0;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:#05070d;color:var(--ink);overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .scene{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(60vmax 60vmax at calc(20% + var(--p)*60%) calc(10% + var(--p)*40%), rgba(47,209,180,.22), transparent 70%),
      radial-gradient(55vmax 55vmax at calc(90% - var(--p)*50%) calc(80% - var(--p)*30%), rgba(42,109,176,.35), transparent 70%),
      radial-gradient(45vmax 45vmax at 50% calc(110% - var(--p)*60%), rgba(224,176,74,.18), transparent 70%),
      #05070d;
    transition:background .3s linear}

  .progress{position:fixed;top:0;left:0;height:2px;width:100%;transform-origin:0 50%;
    transform:scaleX(var(--p));background:linear-gradient(90deg,var(--teal),var(--gold));z-index:10}

  section{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:80px 24px;text-align:center;position:relative}
  .reveal{opacity:0;transform:translateY(40px);filter:blur(8px);
    transition:opacity 1s var(--ease),transform 1s var(--ease),filter 1s var(--ease)}
  .reveal.in{opacity:1;transform:none;filter:none}

  .logo{width:min(62vw,280px);height:auto;aspect-ratio:1;
    transform:scale(calc(.8 + var(--p)*.4));transition:transform .4s linear;
    filter:drop-shadow(0 20px 60px rgba(42,109,176,.5))}
  .eyebrow{font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);margin-top:28px}
  h1{font-size:clamp(3rem,13vw,7.5rem);font-weight:700;letter-spacing:-.04em;line-height:.95;margin-top:12px;
    background:linear-gradient(180deg,#fff 40%,#8fa6c4);-webkit-background-clip:text;background-clip:text;color:transparent}
  .scroll-hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
  .scroll-hint::after{content:"";display:block;width:1px;height:36px;margin:10px auto 0;background:linear-gradient(var(--gold),transparent);animation:drip 2s ease-in-out infinite}
  @keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

  .beat{font-size:clamp(2rem,7vw,4.5rem);font-weight:600;letter-spacing:-.03em;line-height:1.05;max-width:16ch}
  .beat em{font-style:normal;color:var(--gold)}
  .sub{margin-top:20px;font-size:clamp(1rem,2.4vw,1.2rem);color:var(--muted);max-width:36ch;line-height:1.5}

  .video{width:100%;max-width:640px;aspect-ratio:16/9;border-radius:18px;overflow:hidden;
    border:1px solid var(--line);background:#000;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .video iframe{width:100%;height:100%;border:0;display:block}

  .player{width:100%;max-width:420px;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .player iframe{width:100%;height:352px;border:0;display:block}

  .links{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;margin-top:8px}
  a.link{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;
    background:var(--glass);border:1px solid var(--line);color:var(--ink);text-decoration:none;
    font-size:17px;font-weight:500;text-align:left;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    transition:transform .3s var(--ease),border-color .3s,background .3s}
  a.link:hover,a.link:focus-visible{transform:translateY(-3px) scale(1.01);border-color:var(--gold);background:rgba(255,255,255,.1);outline:none}
  .ico{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--teal),var(--blue));font-size:18px}
  .ico svg{width:21px;height:21px;fill:#fff}
  .label{flex:1}
  .arrow{opacity:.4}

  footer{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);padding:40px 0 60px}

  .reel-wrap{overflow:hidden;padding:0}
  .reel{display:flex;gap:24px;padding:0 24px;transform:translateX(calc(40vw - var(--p)*140vw));will-change:transform}
  .frame{flex:none;width:min(60vw,260px);aspect-ratio:4/3;border-radius:22px;border:1px solid var(--line);
    background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .frame svg{width:72%;height:auto}
  .frame span{font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted)}
  .cone{transform-origin:80px 66px;animation:vib .12s ease-in-out infinite alternate}
  .cone.d2{animation-duration:.09s}
  @keyframes vib{from{transform:scale(.92)}to{transform:scale(1.08)}}

  .merge{position:relative;font-size:clamp(2.2rem,8vw,4.8rem);font-weight:600;letter-spacing:-.03em;line-height:1.05;
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.25em;min-height:1.2em;max-width:18ch}
  .merge .w1{color:var(--ink);display:inline-block;transform:translateX(calc(var(--m,0) * 1.6em));transition:transform .2s linear}
  .merge .w2{color:var(--gold);font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;display:inline-block;transform:translateX(calc(var(--m,0) * -1.6em));transition:transform .2s linear}
  .merge .res{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(calc(.85 + var(--m,0) * .15));white-space:nowrap;
    font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;color:var(--gold);opacity:var(--m,0);transition:opacity .2s linear}
  .merge .w1,.merge .w2{opacity:calc(1 - var(--m,0))}
  .sig{margin-top:56px;font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:var(--muted)}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation:none!important;transition:none!important}
    .reveal{opacity:1;transform:none;filter:none}
  }
</style>
</head>

<script>
  (function(){
    var root=document.documentElement, ticking=false;
    function update(){
      var max=document.documentElement.scrollHeight-window.innerHeight;
      var p=max>0?window.scrollY/max:0;
      root.style.setProperty('--p',p.toFixed(4));
      ticking=false;
    }
    window.addEventListener('scroll',function(){
      if(!ticking){requestAnimationFrame(update);ticking=true;}
    },{passive:true});
    update();
  })();

  (function(){
    var items=document.querySelectorAll('.reveal');
    if(!('IntersectionObserver' in window)){items.forEach(function(el){el.classList.add('in')});return;}
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}
      });
    },{threshold:.2});
    items.forEach(function(el){io.observe(el);});
  })();

  (function(){
    var el=document.getElementById('merge');
    if(!el)return;
    function run(){
      var r=el.getBoundingClientRect(), vh=window.innerHeight;
      var m=(vh*0.8 - r.top)/(vh*0.5);
      m=Math.min(1,Math.max(0,m));
      el.style.setProperty('--m',m.toFixed(3));
    }
    window.addEventListener('scroll',run,{passive:true});
    window.addEventListener('resize',run);
    run();
  })();

  document.querySelectorAll('a.link.extra').forEach(function(a){
    if(a.getAttribute('href')==='#') a.style.display='none';
  });
</script>
