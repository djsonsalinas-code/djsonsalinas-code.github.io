<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dx Pinas · A&B Records</title>
<meta name="description" content="Dx Pinas — sígueme en mis redes.">
<meta property="og:title" content="Dx Pinas">
<meta property="og:description" content="A&B Records · Sígueme en mis redes.">
<meta property="og:image" content="fondo.jpg">
<meta name="theme-color" content="#06141a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{--teal:#2fd1b4;--blue:#2a6db0;--gold:#e0b04a;--text:#fff}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#06141a;overflow-x:hidden}

  /* ===== FONDO VISTOSO (no necesita ninguna imagen) ===== */
  .bg{position:fixed;inset:0;z-index:-3;overflow:hidden;background:linear-gradient(160deg,#06141a,#0a2a36 55%,#06141a)}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;mix-blend-mode:screen}
  .b1{width:70vmax;height:70vmax;left:-20vmax;top:-20vmax;background:radial-gradient(circle,#2fd1b4,transparent 65%);animation:m1 18s ease-in-out infinite alternate}
  .b2{width:65vmax;height:65vmax;right:-25vmax;top:10vh;background:radial-gradient(circle,#2a6db0,transparent 65%);animation:m2 22s ease-in-out infinite alternate}
  .b3{width:55vmax;height:55vmax;left:5vmax;bottom:-25vmax;background:radial-gradient(circle,rgba(224,176,74,.8),transparent 65%);animation:m3 26s ease-in-out infinite alternate}
  @keyframes m1{to{transform:translate(18vmax,14vmax) scale(1.15)}}
  @keyframes m2{to{transform:translate(-16vmax,-8vmax) scale(1.2)}}
  @keyframes m3{to{transform:translate(14vmax,-12vmax) scale(1.1)}}

  /* arcoíris suave (como en tu logo) */
  .rainbow{position:absolute;left:50%;top:30%;width:140vmax;height:140vmax;transform:translateX(-50%);border-radius:50%;opacity:.16;
    background:radial-gradient(circle,transparent 52%,#ff4d6d 53%,#ffa94d 56%,#ffe066 59%,#69db7c 62%,#4dabf7 65%,#9775fa 68%,transparent 70%);
    filter:blur(6px)}

  /* brillitos */
  .stars{position:absolute;inset:0;background-image:
    radial-gradient(2px 2px at 12% 20%,#fff,transparent),radial-gradient(2px 2px at 80% 12%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 30% 70%,#fff,transparent),radial-gradient(2px 2px at 65% 55%,#ffe9a8,transparent),
    radial-gradient(1.5px 1.5px at 90% 80%,#fff,transparent),radial-gradient(2px 2px at 45% 35%,#ffe9a8,transparent),
    radial-gradient(1.5px 1.5px at 8% 88%,#fff,transparent),radial-gradient(2px 2px at 55% 92%,#fff,transparent);
    opacity:.7;animation:tw 4s ease-in-out infinite alternate}
  @keyframes tw{from{opacity:.25}to{opacity:.9}}

  /* tu logo difuminado como textura extra (se activa solo si subes la imagen) */
  /* TU LOGO COMO FONDO DE LA PÁGINA, bien visible, que se funde hacia abajo */
  :root{--hero:min(100vw,720px,29vh)}
  .bgimg{position:absolute;top:0;left:50%;width:var(--hero);height:var(--hero);z-index:-2;transform:translateX(-50%);opacity:0;transition:opacity 1s;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 22%,#000 78%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 22%,#000 78%,transparent 100%)}
  .bgimg::before{content:"";position:absolute;inset:0;background-image:var(--img);background-size:cover;background-position:center;
    -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 14%,#000 50%,transparent 80%);mask-image:linear-gradient(180deg,transparent 0%,#000 14%,#000 50%,transparent 80%)}
  .bgimg.on{opacity:1}
  .shade{display:none}
  /* Fondo: degradado diagonal suave, azul profundo a blanco */
  .bg{background:linear-gradient(135deg,#0a2f6b 0%,#1a5fc4 30%,#6fb4f5 62%,#d6ecff 85%,#ffffff 100%)}

  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(var(--hero) - 110px) 22px calc(24px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto;text-align:center}

  /* ===== LOGO ===== */
  /* foto personal opcional: aparece sola si subes foto.jpg */
  .photo{width:72px;height:72px;border-radius:50%;padding:3px;display:none;margin-bottom:10px;
    background:linear-gradient(135deg,var(--gold),var(--teal));box-shadow:0 8px 28px rgba(0,0,0,.5)}
  .photo.on{display:block;animation:fadeUp .8s both}
  .photo img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}

  h1{font-size:clamp(2.2rem,10vw,2.9rem);font-weight:800;letter-spacing:1.5px;line-height:1.1;
    background:linear-gradient(90deg,#fff 0%,#fdf0c8 45%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 18px rgba(0,0,0,.45));animation:fadeUp .8s .1s both}
  .line{width:70px;height:3px;border-radius:3px;margin:14px auto 22px;background:linear-gradient(90deg,var(--teal),var(--gold));animation:fadeUp .8s .2s both}

  .links{width:100%;display:flex;flex-direction:column;gap:12px}
  a.link{position:relative;overflow:hidden;display:flex;align-items:center;padding:14px 20px;border-radius:18px;
    background:rgba(8,40,95,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.2);color:var(--text);text-decoration:none;font-weight:700;font-size:1.05rem;letter-spacing:.3px;
    box-shadow:0 8px 30px rgba(0,0,0,.28);transition:transform .2s,border-color .2s,background .2s,box-shadow .2s;animation:fadeUp .7s both}
  a.link:nth-child(1){animation-delay:.3s}a.link:nth-child(2){animation-delay:.4s}
  a.link:nth-child(3){animation-delay:.5s}a.link:nth-child(4){animation-delay:.6s}
  a.link::before{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);transition:left .6s}
  a.link:hover,a.link:focus-visible,a.link:active{transform:translateY(-3px) scale(1.015);border-color:var(--gold);
    background:rgba(8,40,95,.75);box-shadow:0 12px 40px rgba(10,47,107,.45);outline:none}
  a.link:hover::before,a.link:active::before{left:140%}
  a.link .ico{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--teal),var(--blue));box-shadow:0 4px 14px rgba(0,0,0,.25)}
  a.link svg{width:21px;height:21px;fill:#fff}
  a.link span{flex:1;text-align:center;margin-right:40px}

  /* Esfera dorada que rebota lento */
  .globe-wrap{position:relative;width:116px;height:134px;margin-bottom:2px;animation:fadeUp .8s both}
  .globe{width:116px;height:116px;display:block;animation:bounce 3.6s ease-in-out infinite;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.4)) drop-shadow(0 0 16px rgba(70,150,255,.55))}
  .gshadow{position:absolute;bottom:0;left:50%;width:64px;height:10px;margin-left:-32px;border-radius:50%;
    background:rgba(0,0,0,.4);filter:blur(4px);animation:gshadow 3.6s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(16px)}50%{transform:translateY(0)}}
  @keyframes gshadow{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(.6);opacity:.25}}
  .slogan{margin:14px 0 22px;padding:9px 18px;border-radius:999px;font-size:.95rem;font-weight:700;letter-spacing:.4px;color:#fff6d6;
    background:linear-gradient(135deg,rgba(8,40,95,.7),rgba(8,40,95,.5));border:1px solid rgba(224,176,74,.85);
    box-shadow:0 6px 24px rgba(8,40,95,.35),0 0 18px rgba(224,176,74,.25);animation:fadeUp .8s .2s both}
  .slogan i{font-style:normal;color:var(--gold);margin:0 4px}
  footer{margin-top:22px;font-size:.78rem;letter-spacing:3px;text-transform:uppercase;color:#0a2f6b;font-weight:700;animation:fadeUp .8s .8s both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bgimg" id="bgimg"></div>

<main>

    <!-- ===== BOTONES LISTOS PARA CUANDO LOS NECESITES =====
         Cambia el # por tu link y el botón aparece solo. Mientras diga # queda oculto. -->

<script>
/* Busca solo la imagen: no tienes que editar nada.
   Logo:  fondo.jpg / fondo.png / logo.jpg / logo.png (el primero que exista)
   Foto (opcional): foto.jpg / foto.png / foto.jpeg */
function firstImage(names, ok){
  var i=0;
  (function next(){
    if(i>=names.length) return;
    var im=new Image(), n=names[i++];
    im.onload=function(){ok(n)};
    im.onerror=next;
    im.src=n;
  })();
}
firstImage(['fondo.jpg','1791333092858.jpg','1000197699.jpg','fondo.png','fondo.jpeg','fondo.webp','logo.jpg','logo.png','logo.jpeg','logo.webp'],function(src){
  var b=document.getElementById('bgimg'); b.style.setProperty('--img','url("'+src+'")'); b.classList.add('on');
});
/* Los botones extra (Spotify, etc.) quedan ocultos hasta que les pongas link */
document.querySelectorAll('a.link.extra').forEach(function(a){
  if(a.getAttribute('href')==='#') a.style.display='none';
});
firstImage(['foto.jpg','foto.png','foto.jpeg','foto.webp'],function(src){
  document.getElementById('photoimg').src=src;
  document.getElementById('photo').classList.add('on');
});
</script>
</body>
</html>
